spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/discodeit
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
  boot:
    admin:
      client:
        url: ${SPRING_BOOT_ADMIN_CLIENT_URL}

server:
  port: 80

logging:
  level:
    root: info
    com.something.discodeit: info
