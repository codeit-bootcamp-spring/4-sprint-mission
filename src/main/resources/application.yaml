spring:
  profiles:
    active: dev
  info:
    app:
      name: Discodeit
      version: 1.7.0
    java:
      version: 17
  boot:
    version: 3.5.0
  application:
    name: discodeit
    config:
      datasource:
        url: jdbc:postgresql://localhost:5432/discodeit
        username: discodeit_user
        password: discode1234
        driver-class-name: org.postgresql.Driver
      jpa:
        ddl-auto: none
      multipart:
        max-file-size: 50MB
        max-request-size: 50MB
  cache:
    cache-names:
      - channels
      - notifications
      - users
    caffeine:
      spec:
        initialCapacity=100,
        maximumSize=1000,
        expireAfterAccess=30m,
        recordStats
    redis:
      enable-statistics: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: discodeit-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

logging:
  level:
    root: INFO

server:
  port: 80

management:
  observations:
    annotations:
      enabled: true
  endpoints:
    web:
      exposure:
        include: "*"
      base-path: /actuator
  endpoint:
    health:
      show-details: never
    info:
      enabled: true
    metrics:
      enabled: true
    loggers:
      enabled: true
    caches:
      enabled: true


discodeit:
  storage:
    type: ${STORAGE_TYPE:local} # 기본 값 local
    local:
      root-path: ${STORAGE_LOCAL_ROOT_PATH:.discoedit/storage}
    s3:
      access-key: ${AWS_S3_ACCESS_KEY}
      secret-key: ${AWS_S3_SECRET_KEY}
      region: ${AWS_S3_REGION}
      bucket: ${AWS_S3_BUCKET}
      presigned-url-expiration: ${AWS_S3_PRESIGNED_URL_EXPIRATION:600} # 기본값 10분
    path: ./discodeit/local/storage


admin:
  username: "admin"
  email: "admin@admin.com"
  password: "admin1234"
