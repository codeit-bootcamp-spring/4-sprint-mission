spring:
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
  datasource:
    url: jdbc:postgresql://localhost:5432/discodeit
    username: discodeit_user
    password: discodeit1234
    driver-class-name: org.postgresql.Driver
  profiles:
    active: local
  server:
    port: 8080
  application:
    name: discodeit
  boot:
    admin:
      client:
        instance:
          name: discodeit

discodeit:
  storage:
    local:
      root-path: ./uploads

logging:
  level:
    root: info
    org.hibernate.SQL: debug
    org.hibernate.type: trace
    javax.management.remote.rmi: info
    sun.rmi.transport.tcp: info