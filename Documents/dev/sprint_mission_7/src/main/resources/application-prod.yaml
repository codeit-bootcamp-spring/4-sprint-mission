server:
  port: 80
  servlet:
    context-path: /

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/discodeit
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false

logging:
  level:
    root: INFO

management:
  endpoints:
    web:
      exposure:
        include: "health,info"