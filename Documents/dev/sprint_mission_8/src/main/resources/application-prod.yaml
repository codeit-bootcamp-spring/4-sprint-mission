server:
  port: 80
  servlet:
    context-path: /

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${POSTGRES_USERNAME}
    password: ${POSTGRES_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false

logging:
  level:
    root: INFO

management:
  endpoints:
    web:
      exposure:
        include: "health,info"

