spring:
  application:
    name: discodeit
  profiles:
    active: local
  datasource:
    url: jdbc:postgresql://localhost:5432/discodeit
    username: discodeit_user
    password: discodeit1234
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

discodeit:
  storage:
    type: ${STORAGE_TYPE:local}
    local:
      root-path: ${STORAGE_LOCAL_ROOT_PATH:.discodeit/storage}

logging:
  level:
    root: INFO
    com.sprint.mission.discodeit: DEBUG
  file:
    name: discodeit.log
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

info:
  app:
    name: Discodeit
    version: "1.7.0"
    java: "17"
    spring-boot: "3.4.0"
  settings:
    datasource:
      url: ${spring.datasource.url}
      driver: ${spring.datasource.driver-class-name}
    jpa:
      hibernate:
        ddl-auto: ${spring.jpa.hibernate.ddl-auto}
    storage:
      type: ${discodeit.storage.type}
      path: ${discodeit.storage.local.root-path}
    multipart:
      max-file-size: ${spring.servlet.multipart.max-file-size}
      max-request-size: ${spring.servlet.multipart.max-request-size}

management:
  info:
    env:
      enabled: true
    defaults:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,metrics,loggers

aws:
  credentials:
    access-key: ${AWS_CREDENTIAL_ACCESS_KEY}
    secret-key: ${AWS_CREDENTIAL_SECRET_KEY}
  s3:
    bucket: ${AWS_S3_BUCKET}
    endpoint: ${AWS_S3_ENDPOINT}
    region: ${AWS_S3_REGION:ap-northeast-2}
  presigned-url-expiration: ${AWS_S3_PRESIGNED_URL_EXPIRATION:600}