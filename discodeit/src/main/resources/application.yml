spring:
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

springdoc:
  swagger-ui:
    path: /docs
    enabled: true
  api-docs:
    enabled: true
  default-produces-media-type: application/json
  info:
    title: "Discodeit API 문서"
    description: "Discodeit 프로젝트의 Swagger API 문서입니다."
    version: "v3"