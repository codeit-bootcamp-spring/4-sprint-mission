worker_processes auto;
events {}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream; # fallback

    upstream backend {
        # least_conn;
        ip_hash;
        server app:8080 max_fails=3 fail_timeout=30s;
    }

    server {
        listen 80;

        # 백엔드
        location /api/ {
          proxy_pass http://backend;   # 요청을 백엔드로 전달
          proxy_next_upstream error timeout http_502 http_503 http_504;
          proxy_connect_timeout 10s;
          proxy_send_timeout 30s;
          proxy_read_timeout 30s;

          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_set_header X-Forwarded-Host $host;
          proxy_set_header X-Forwarded-Port $server_port;

          proxy_set_header Cookie $http_cookie;

          # CRITICAL: Allow credentials and preserve Set-Cookie headers
          proxy_pass_header Set-Cookie;
          proxy_pass_header Authorization;

          # Don't buffer - important for real-time responses
          proxy_buffering off;

          add_header X-Upstream-Server $upstream_addr always;
        }

        location /ws/ {
            proxy_pass http://backend;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_set_header Cookie $http_cookie;
            proxy_pass_header Set-Cookie;

            proxy_read_timeout 86400;

            add_header X-Upstream-Server $upstream_addr;
        }

        location / {
            root /usr/share/nginx/html; # docker-compose에서 연결한 볼륨
            index index.html;
            try_files $uri $uri/ /index.html;
        }

    }
}
