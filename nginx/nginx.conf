worker_processes auto;
events {}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream; # fallback

    upstream backend {
        server app:8080 max_fails=3 fail_timeout=30s;
    }

    server {
        listen 80;

        # 백엔드
        location /api/ {
          proxy_pass http://backend;   # 요청을 백엔드로 전달
          proxy_next_upstream error timeout http_502 http_503 http_504;
          proxy_connect_timeout 10s;
          proxy_send_timeout 30s;
          proxy_read_timeout 30s;


          proxy_set_header Host $host;      # 원본 Host 전달
          proxy_set_header X-Real-IP $remote_addr; # 클라이언트 IP 전달
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /ws/ {
            proxy_pass http://app:8080;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location / {
            root /usr/share/nginx/html; # docker-compose에서 연결한 볼륨
            index index.html;
            try_files $uri $uri/ /index.html;
        }

    }
}
